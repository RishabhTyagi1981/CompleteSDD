<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDD Production Gateway</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { background-color: var(--bg-card); width: 100%; max-width: 420px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid #334155; }
        h2 { font-size: 24px; margin-bottom: 8px; font-weight: 700; text-align: center; }
        .subtitle { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px 16px; background-color: var(--bg-main); border: 1px solid #334155; border-radius: 6px; color: var(--text); font-size: 15px; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: var(--accent); }
        button { width: 100%; padding: 12px; background-color: var(--accent); border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        button:hover { background-color: var(--accent-hover); }
        .alert { padding: 12px; border-radius: 6px; font-size: 14px; margin-top: 20px; display: none; line-break: anywhere; }
        .alert-error { background-color: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: #fca5a5; }
        .alert-success { background-color: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); color: #a7f3d0; }
    </style>
</head>
<body>

<div class="container">
    <h2>SDD Control Center</h2>
    <p class="subtitle">Secure API Authentication Interface</p>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" value="admin" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" value="Secure123!" required>
        </div>
        <button type="submit" id="submitBtn">Authenticate</button>
    </form>

    <div id="responseAlert" class="alert"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('responseAlert');
        const submitBtn = document.getElementById('submitBtn');
        
        alertBox.style.display = 'none';
        submitBtn.innerText = 'Connecting...';
        
        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            // Dispatches network traffic directly to your backend Node service engine
            const response = await fetch('http://localhost:3000/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                alertBox.className = 'alert alert-success';
                alertBox.innerHTML = `<strong>Success! Token Issued:</strong><br><small>${data.token}</small>`;
            } else {
                alertBox.className = 'alert alert-error';
                alertBox.innerHTML = `<strong>Error:</strong> ${data.error || 'Authentication denied'}`;
            }
        } catch (error) {
            alertBox.className = 'alert alert-error';
            alertBox.innerHTML = `<strong>Network Failure:</strong> Ensure your backend is running locally on port 3000.`;
        } finally {
            alertBox.style.display = 'block';
            submitBtn.innerText = 'Authenticate';
        }
    });
</script>
</body>
</html>
